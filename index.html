<!DOCTYPE html>
<html>

<head>
    <title>Calculator V2</title>
    <link rel="stylesheet" href="style.css">
    <meta name="google-site-verification" content="gXm3zyX0kWeHFMFAqF57ucVEi_a-nGp98t1D4Y2-Xu4" />
</head>

<body>
    <div class="calculatorElement">
        <div class="calculatorContainer">
            <div class="top_boxContainer">
                <input id="top_box" readonly>
            </div>
            <div class="btnRowsCintainer">
                <button class="btn" id="factorial">x!</button>
                <button class="btn" id="(">(</button>
                <button class="btn" id=")">)</button>
                <button class="btn" id="backspace">⌫</button>
                <button class="btn" id="ac">AC</button>
            </div>
            <div class="btnRowsCintainer">
                <button class="btn" id="%">%</button>
                <button class="btn" id="7">7</button>
                <button class="btn" id="8">8</button>
                <button class="btn" id="9">9</button>
                <button class="btn" id="divide">÷</button>
            </div>
            <div class="btnRowsCintainer">
                <button class="btn" id="pie">𝜋</button>
                <button class="btn" id="4">4</button>
                <button class="btn" id="5">5</button>
                <button class="btn" id="6">6</button>
                <button class="btn" id="times">×</button>
            </div>
            <div class="btnRowsCintainer">
                <button class="btn" id="root">√</button>
                <button class="btn" id="1">1</button>
                <button class="btn" id="2">2</button>
                <button class="btn" id="3">3</button>
                <button class="btn" id="minus">-</button>
            </div>
            <div class="btnRowsCintainer">
                <button class="btn" id="pow">xʸ</button>
                <button class="btn" id=".">.</button>
                <button class="btn" id="0">0</button>
                <button class="btn" id="equal">=</button>
                <button class="btn" id="plus">+</button>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
    <script src="https://richardliucode.github.io/richardcode/RichardJS/footer.js"></script>
</body>

</html>
